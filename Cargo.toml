[package]
name = "shell-3d"
version = "0.1.0"
edition = "2021"
description = "Interactive 3D Model Viewer in the Terminal (ASCII Renderer with Z-Buffer)"

[dependencies]
crossterm = "0.28"
glam = "0.29"
tobj = { version = "4.0", default-features = false }
stl_io = "0.7"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
